    <div class="card ${h.alerta ? 'alerta' : ''}" style="display:flex;gap:10px;align-items:flex-start">${dot(h.cor, true)}<div class="stack" style="gap:4px"><span>${esc(h.texto)}</span>${h.ocupId ? `<button class="link" data-ir="lote" data-p="${h.ocupId}">Abrir o lote ${n3(h.ocupId)}</button>` : ''}</div></div>
    <h2>Onde estão as peças</h2>
    ${trilha(c)}
    <p class="sub">${abertas} peça(s) em aberto na fábrica${atras ? ` · <span class="flag">${atras} lote(s) acima de 12 dias úteis</span>` : ''}</p>
    <button class="btn dark" data-ir="retorno">Retorno da manutenção · limpeza, banho, flash</button>
    ${lotes.length ? `<div class="lotesmini">${lotes.map(l => `<button class="lchip" data-ir="lote" data-p="${l.id}">${dot(l.cor_ordem)}${n3(l.id)} <span class="s">${l.total - l.devolvida} pç</span></button>`).join('')}</div>` : ''}
    <input id="busca" type="search" placeholder="Buscar nº do formulário ou consultora" aria-label="Buscar requisição">
    <h2>A receber na fábrica (${aRec.length})</h2>${naLoja ? `<p class="sub">${naLoja} requisição(ões) ainda na loja, sem remessa finalizada.</p>` : ''}${lista(aRec, 'Nada a receber.')}
    <h2>Prontas para devolver (${prontas.length})</h2>${lista(prontas, 'Nenhuma pronta ainda.')}`;
  $('#busca').oninput = e => { const t = e.target.value.trim().toLowerCase(); document.querySelectorAll('.row[data-busca]').forEach(r => r.hidden = !!t && !r.dataset.busca.includes(t)); };
};

// ====== Nova requisição ======
R.nova = async () => {
  let execs = [];
  if (S.perfil !== 'executiva') {
    const {data, error} = await sb.from('fab_perfis').select('id,nome').eq('perfil', 'executiva').eq('ativo', true).order('nome');
    if (error) throw error; execs = data;
  }
  const hoje = hojeISO(); let pecas = [], fotos = [], seq = 0;
  const IA = {estado: '', total: 0, modo: '', exemplos: 0};   // estado: '' | analisando | ok | erro ; modo: pergunta | ajustando | conferido
  const NOMES = {corrente: ['corrente', 'correntes'], anel: ['anel', 'anéis'], pingente: ['pingente', 'pingentes'], pulseira: ['pulseira', 'pulseiras'],
    tornozeleira: ['tornozeleira', 'tornozeleiras'], brinco: ['par de brincos', 'pares de brincos'], outro: ['outra peça', 'outras peças']};
  const resumo = () => { const c = {}; pecas.forEach(p => c[p.grupo] = (c[p.grupo] || 0) + 1);
    return GRUPOS.map(([g]) => g).filter(g => c[g]).map(g => `${c[g]} ${NOMES[g][c[g] > 1 ? 1 : 0]}`).join(', '); };

  $('#main').innerHTML = `
  <div><h1>Nova requisição</h1><p class="sub">Comece pela foto. A IA identifica e descreve as peças, e você confere.</p></div>
  <form id="fReq" class="stack">
    <div class="card stack">
      <h2 style="margin:0">1. Foto das peças</h2>
      <div class="dica"><b>Padrão da foto</b><ol>
        <li>Régua esticada na parte de baixo.</li>
        <li>De cima para baixo: correntes (esticadas), anéis e pingentes, pulseiras, brincos.</li>
        <li>Brinco: um em pé, cravado no tapete, e o par deitado ao lado.</li>
        <li>Celular reto, de cima, sem sol direto.</li></ol></div>
      <div class="grid2"><label class="btn outline small" for="rCam">Tirar foto</label><label class="btn outline small" for="rGal">Da galeria</label></div>
      <input id="rCam" type="file" accept="image/*" capture="environment" hidden>
      <input id="rGal" type="file" accept="image/*" multiple hidden>
      <div id="rPrev"></div>
    </div>
    <div class="card stack">
      <h2 style="margin:0">2. Peças</h2>
      <div id="rIA"></div>
      <div id="rPecas" class="stack"></div>
      <span class="lbl">Adicionar peça manualmente</span>
      <div class="grupos">${GRUPOS.map(([g, n]) => `<button type="button" class="chipbtn" data-act="add" data-v="${g}">+ ${n}</button>`).join('')}</div>
    </div>
    <div class="card stack">
      <h2 style="margin:0">3. Dados da requisição</h2>
      ${S.perfil !== 'executiva' ? `<div class="field"><label for="rExec">Loja</label><select id="rExec"><option value="">${execs.length ? 'Escolha a loja' : 'Nenhuma loja cadastrada'}</option>${execs.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>` : ''}
      <div class="grid2">
        <div class="field"><label for="rNum">Nº da requisição *</label><input id="rNum" inputmode="numeric" required placeholder="ex.: 069733"></div>
        <div class="field"><label for="rCons">Consultora *</label><input id="rCons" required autocomplete="off"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="rRec">Recebido em</label><input id="rRec" type="date" value="${hoje}" required></div>
        <div class="field"><label for="rProm">Entregar até</label><input id="rProm" type="date" value="${addDias(hoje, 30)}" required></div>
      </div>
      <div class="field"><span class="lbl">Devolução para a loja</span>
        <div class="seg two"><label><input type="radio" name="rModo" value="completa" checked>Completa</label><label><input type="radio" name="rModo" value="parcial">Parcial</label></div></div>
      <div class="field"><label for="rObs">Observação</label><textarea id="rObs" rows="2" placeholder="ex.: banho dourado"></textarea></div>
    </div>
    <button class="btn" type="submit" id="rSalvar">Salvar requisição</button>
  </form>`;

  const renderFotos = () => {
    $('#rPrev').innerHTML = fotos.length ? `<div class="thumbs">${fotos.map((f, i) => `<div class="th"><img src="${f.url}" alt="Foto ${i + 1}" data-zoom="${f.url}"><button type="button" class="x" data-act="rmFoto" data-i="${i}" aria-label="Remover foto">×</button></div>`).join('')}</div>
      ${IA.estado !== 'analisando' ? `<button type="button" class="btn dark small" data-act="analisar">${IA.estado === 'ok' ? 'Identificar de novo com a IA' : 'Identificar peças com a IA'}</button>` : ''}` : '<p class="vazio">Nenhuma foto ainda.</p>';
  };
  const renderIA = () => {
    const box = $('#rIA');
    if (IA.estado === 'analisando') { box.innerHTML = '<div class="ia"><i></i>A IA está identificando as peças da foto…</div>'; return; }
    if (IA.estado === 'erro') { box.innerHTML = '<p class="sub">A IA não conseguiu analisar a foto. Lance as peças manualmente abaixo ou tente de novo.</p>'; return; }
    if (IA.estado !== 'ok') { box.innerHTML = fotos.length ? '' : '<p class="sub">Tire a foto primeiro. As peças aparecem aqui.</p>'; return; }
    const txt = pecas.length ? `<b>${pecas.length} peça(s)</b>: ${esc(resumo())}` : '<b>nenhuma peça</b>';
    if (IA.modo === 'conferido') box.innerHTML = `<div class="result">Conferido: ${txt}.</div>`;
    else if (IA.modo === 'ajustando') box.innerHTML = `<div class="card stack" style="gap:8px;background:var(--warn-soft)"><span>Ajuste a lista: remova o que não existe, corrija o grupo ou adicione a peça que faltou.</span>
      <span>Agora são ${txt}.</span><button type="button" class="btn green small" data-act="confSim">Agora confere</button></div>`;
    else box.innerHTML = `<div class="card stack" style="gap:8px;background:var(--rose-soft)"><span>A IA encontrou ${txt}${IA.total > pecas.length ? ` <span class="flag">(contou ${IA.total} na foto)</span>` : ''}.</span>
      <b>Confere com as peças que você tem em mãos?</b>
      <div class="grid2"><button type="button" class="btn green small" data-act="confSim">Sim, confere</button><button type="button" class="btn outline small" data-act="confNao">Não, vou ajustar</button></div></div>`;
  };
  const renderPecas = () => {
    pecas.sort((a, b) => ordemG(a.grupo) - ordemG(b.grupo) || a.k - b.k);
    $('#rPecas').innerHTML = pecas.map((p, i) => `
      <div class="peca"><div class="top2"><b>${i + 1} · ${GNOME[p.grupo]}${p.ia ? ' <span class="pill info">IA</span>' : ' <span class="pill warn">manual</span>'}</b><button type="button" class="link" data-act="del" data-k="${p.k}">Remover</button></div>
        <div class="field"><label for="d${p.k}">Descrição</label><textarea id="d${p.k}" rows="2" data-k="${p.k}" data-f="descricao">${esc(p.descricao)}</textarea></div>
        <div class="grid2">
          <div class="field"><label for="g${p.k}">Grupo</label><select id="g${p.k}" data-k="${p.k}" data-f="grupo">${GRUPOS.map(([g, n]) => `<option value="${g}" ${p.grupo === g ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div class="field"><label for="m${p.k}">Medida</label><input id="m${p.k}" data-k="${p.k}" data-f="medida" value="${esc(p.medida)}" placeholder="${PH[p.grupo]}"></div>
        </div></div>`).join('');
    renderIA();
  };
  const mudou = () => { if (IA.estado === 'ok' && IA.modo === 'conferido') IA.modo = 'ajustando'; };
  renderFotos(); renderPecas();

  async function analisar() {
    if (!fotos.length) return;
    IA.estado = 'analisando'; renderFotos(); renderIA();
    try {
      const imgs = [];
      for (const f of fotos.slice(0, 6)) imgs.push(await b64(await comprimir(f.file, 1600, 0.85)));
      const d = await ia({acao: 'analisar', fotos: imgs});
      pecas = d.pecas.map(p => ({k: ++seq, grupo: p.grupo, medida: p.medida_estimada ? '≈ ' + p.medida_estimada : '', descricao: p.descricao, descricao_ia: p.descricao, ia: true}));
      Object.assign(IA, {estado: 'ok', total: d.total_na_foto, modo: 'pergunta', exemplos: d.exemplos || 0});
    } catch (e) { IA.estado = 'erro'; toast(erroMsg(e), true); }
    renderFotos(); renderPecas();
  }

  const addFotos = e => { const novas = [...e.target.files]; novas.forEach(f => fotos.push({file: f, url: URL.createObjectURL(f)})); e.target.value = '';
    renderFotos(); if (novas.length && IA.estado === '') analisar(); else renderIA(); };
  $('#rCam').onchange = addFotos; $('#rGal').onchange = addFotos;
  $('#rRec').onchange = e => { if (e.target.value) $('#rProm').value = addDias(e.target.value, 30); };
  $('#rPecas').oninput = e => { const p = pecas.find(x => x.k == e.target.dataset.k); if (p && e.target.dataset.f !== 'grupo') p[e.target.dataset.f] = e.target.value; };
  $('#rPecas').onchange = e => { if (e.target.dataset.f !== 'grupo') return; const p = pecas.find(x => x.k == e.target.dataset.k); if (p) { p.grupo = e.target.value; mudou(); renderPecas(); } };
  ACT.analisar = () => analisar();
  ACT.confSim = () => { IA.modo = 'conferido'; renderIA(); };
  ACT.confNao = () => { IA.modo = 'ajustando'; renderIA(); };
  ACT.add = b => { pecas.push({k: ++seq, grupo: b.dataset.v, medida: '', descricao: '', descricao_ia: null, ia: false}); mudou(); renderPecas();
    const el = document.getElementById('d' + seq); if (el) el.focus(); };
  ACT.del = b => { pecas = pecas.filter(x => x.k != b.dataset.k); mudou(); renderPecas(); };
  ACT.rmFoto = b => { fotos.splice(+b.dataset.i, 1); renderFotos(); renderIA(); };

  $('#fReq').onsubmit = async e => {
    e.preventDefault(); const b = $('#rSalvar');
    if (!fotos.length) return toast('Tire ao menos uma foto das peças.', true);
    if (!pecas.length) return toast('Nenhuma peça na lista. Use a IA ou adicione manualmente.', true);
    if (IA.estado === 'ok' && IA.modo !== 'conferido') { $('#rIA').scrollIntoView({behavior: 'smooth'}); return toast('Confira a quantidade de peças (passo 2) antes de salvar.', true); }
    if (!$('#rNum').value.trim()) return toast('Informe o número da requisição.', true);
    if (!$('#rCons').value.trim()) return toast('Informe a consultora.', true);
    const execId = S.perfil === 'executiva' ? S.user.id : ($('#rExec').value || null);
    b.disabled = true; b.textContent = 'Salvando…';
    try {
      const {data: r, error} = await sb.from('cons_requisicoes').insert({
        numero_formulario: $('#rNum').value.trim(), executiva_id: execId, consultora: $('#rCons').value.trim(),
        data_recebimento: $('#rRec').value, data_promessa: $('#rProm').value,
        modo_devolucao: document.querySelector('input[name=rModo]:checked').value, observacao: $('#rObs').value.trim() || null,
        ia_qtd_foto: IA.estado === 'ok' ? IA.total : null
      }).select('id').single();
      if (error) throw error;
      const {error: ep} = await sb.from('cons_pecas').insert(pecas.map((p, i) => ({requisicao_id: r.id, posicao: i + 1, grupo: p.grupo,
        medida: p.medida.trim() || null, descricao: p.descricao.trim() || null, descricao_ia: p.descricao_ia || null})));
      if (ep) throw ep;
      for (let i = 0; i < fotos.length; i++) {
        b.textContent = `Enviando foto ${i + 1} de ${fotos.length}…`;
        const base = `req/${r.id}/${Date.now()}-${i}`;
        const grande = await comprimir(fotos[i].file), menor = await comprimir(fotos[i].file, 1024, 0.8);
        for (const [sufixo, blob] of [['.jpg', grande], ['-ia.jpg', menor]]) {
          const {error: eu} = await sb.storage.from('consertos').upload(base + sufixo, blob, {contentType: 'image/jpeg'});
          if (eu) throw eu;
        }
        const {error: ef} = await sb.from('cons_fotos').insert({requisicao_id: r.id, caminho: base + '.jpg', caminho_ia: base + '-ia.jpg', tipo: 'chegada'});
        if (ef) throw ef;
      }
      if (IA.estado !== 'ok') {
        b.textContent = 'A IA está descrevendo as peças…';
        try { const d = await ia({acao: 'descrever', requisicao_id: r.id}); toast(`Requisição salva. A IA descreveu ${d.gravadas} peça(s).`); }
        catch (e2) { toast('Requisição salva, mas a IA não descreveu: ' + erroMsg(e2), true); }
      } else toast(`Requisição salva com ${pecas.length} peça(s) conferidas.`);
      ir('req', r.id);
    } catch (err) { toast(erroMsg(err), true); b.disabled = false; b.textContent = 'Salvar requisição'; }
  };
};

// ====== Requisição ======
let ABRIR_ADD = false;
R.req = async id => {
  const q = await sb.from('cons_requisicoes').select('*,fab_perfis!cons_requisicoes_executiva_id_fkey(nome),cons_lotes!cons_requisicoes_lote_id_fkey(id,cor_ordem)').eq('id', id).single();
  if (q.error) throw q.error;
  const r = q.data;
  const [qp, qf] = await Promise.all([
    sb.from('cons_pecas').select('*,cons_lotes!cons_pecas_lote_id_fkey(id,cor_ordem)').eq('requisicao_id', id).order('posicao'),
    sb.from('cons_fotos').select('*').eq('requisicao_id', id).order('id')
  ]);
  if (qp.error) throw qp.error; if (qf.error) throw qf.error;
  const pecas = qp.data, fotos = qf.data, urls = await assinar(fotos.map(f => f.caminho).concat(r.comprovante ? [r.comprovante] : []));
  r.cons_pecas = pecas;
  const fab = S.perfil !== 'executiva', conferir = fab && ['registrada','enviada'].includes(r.status);
  const volt = pecas.filter(p => p.status === 'retornou'), falta = pecas.filter(p => !['retornou','devolvida'].includes(p.status));
  const podeExcluir = S.perfil === 'gestao' || (r.status === 'registrada' && (fab || r.executiva_id === S.user.id));
  const podeAdd = r.status !== 'devolvida' && (fab || r.status === 'registrada');
  // Excluir peça lançada por engano: fábrica/gestão enquanto a requisição não foi devolvida; a loja só antes de enviar.
  // Precisa sobrar pelo menos uma peça ainda em processo (senão, exclua a requisição inteira).
  const podeDelPeca = p => podeAdd && p.status !== 'devolvida' && pecas.some(q => q.id !== p.id && q.status !== 'devolvida');
  const btnDel = p => podeDelPeca(p) ? `<button type="button" class="link" style="color:#b3261e" data-act="delPeca" data-id="${p.id}">Excluir esta peça (lançada por engano)</button>` : '';

  // Fran pode corrigir medida/descrição/serviço depois da conferência, enquanto a peça está na fábrica (antes da manutenção)
  const podeEditar = p => fab && r.status === 'na_fabrica' && (p.status === 'na_fabrica' || (p.nao_fressen && p.status === 'retornou'));
  const linha = p => `<div class="peca" id="pc${p.id}"><div class="top2"><b>${p.posicao} · ${GNOME[p.grupo]}${p.medida ? ' · ' + esc(p.medida) : ''}</b><span class="pill ${stP(p)[1]}">${stP(p)[0]}</span></div>
    ${p.descricao ? `<div>${esc(p.descricao)}</div>` : ''}
    ${!p.descricao && p.descricao_ia ? `<div>${esc(p.descricao_ia)}</div>` : ''}
    ${p.obs_loja ? `<div class="s">Obs. da loja: ${esc(p.obs_loja)}</div>` : ''}
    ${p.nao_fressen ? `<div class="flag" style="font-size:13px">${NF} · foi direto para o saquinho, sem serviço</div>` : `<div class="s">Previsto: ${SNOME[p.servico_previsto] || '—'}${p.servico_feito ? ' · Feito: ' + SNOME[p.servico_feito] : ''}${p.cons_lotes && p.cons_lotes.cor_ordem === 0 ? ' · no lote Preto' : ''}</div>`}
    ${p.consumo_ml != null || p.custo != null ? `<div class="s">${p.consumo_ml != null ? 'Ouro: ' + ml(p.consumo_ml) : ''}${p.consumo_ml != null && p.custo != null ? ' · ' : ''}${p.custo != null ? 'Custo: <b>' + brl(p.custo) + '</b>' : ''}</div>` : ''}${podeEditar(p) ? `<button type="button" class="link" data-act="editPeca" data-id="${p.id}">Editar medida, descrição, serviço ou "${NF}"</button>` : ''}${btnDel(p)}</div>`;
  const conf = p => `<div class="peca"><b>${p.posicao} · ${GNOME[p.grupo]}</b>
    ${p.obs_loja ? `<div class="s">Obs. da loja: <b>${esc(p.obs_loja)}</b></div>` : ''}
    <div class="field"><label for="d${p.id}">Descrição${p.descricao_ia && (!p.descricao || p.descricao === p.descricao_ia) ? ' (sugerida pela IA, pode editar)' : ''}</label><textarea id="d${p.id}" rows="4">${esc(p.descricao || p.descricao_ia)}</textarea></div>
    ${p.descricao_ia && p.descricao && p.descricao_ia !== p.descricao ? `<div class="s">Texto original da IA: ${esc(p.descricao_ia)}</div>` : ''}
    <div class="field" style="max-width:220px"><label for="m${p.id}">Medida</label><input id="m${p.id}" value="${esc(p.medida)}" placeholder="${PH[p.grupo]}"></div>
    <div class="field"><span class="lbl">Serviço previsto</span><div class="seg">${SERV.map(([s, n]) => `<label><input type="radio" name="s${p.id}" value="${s}" ${(p.servico_previsto || 'limpeza') === s ? 'checked' : ''}>${n}</label>`).join('')}</div></div>
    <label class="check"><input type="checkbox" id="nf${p.id}" ${p.nao_fressen ? 'checked' : ''}><span><b>${NF}</b> · vai direto para o saquinho, sem passar pela manutenção</span></label>${btnDel(p)}</div>`;
  const totalCusto = pecas.reduce((s, p) => s + Number(p.custo || 0), 0);
  const totalOuro = pecas.reduce((s, p) => s + Number(p.consumo_ml || 0), 0);
  const podeCusto = fab && ['na_fabrica','devolvida'].includes(r.status) && pecas.some(p => ['retornou','devolvida'].includes(p.status));
  const custos = podeCusto ? `<div class="card stack"><h2 style="margin:0">Custo do conserto</h2>
      <p class="sub">Informe o valor de cada peça que teve custo. Deixe vazio se não houver.</p>
      ${pecas.filter(p => ['retornou','devolvida'].includes(p.status)).map(p => `<div class="grid2" style="align-items:end">
        <div><b>${p.posicao} · ${GNOME[p.grupo]}</b><div class="s">${feitoTxt(p)}${p.consumo_ml != null ? ' · ouro ' + ml(p.consumo_ml) : ''}</div></div>
        <div class="field"><label for="c${p.id}">Valor (R$)</label><input id="c${p.id}" inputmode="decimal" value="${p.custo != null ? String(p.custo).replace('.', ',') : ''}" placeholder="0,00"></div></div>`).join('')}
      <div class="top2"><span>Total da requisição</span><b>${brl(totalCusto)}</b></div>
      <button class="btn outline small" data-act="salvarCustos">Salvar custos</button></div>`
    : (totalCusto ? `<div class="card top2"><span>Valor do conserto</span><b>${brl(totalCusto)}</b></div>` : '');
  let entrega = '';
  if (r.status === 'devolvida') {
    if (r.entregue_em) entrega = `<div class="card stack"><h2 style="margin:0">Entregue à consultora</h2><p class="sub">Em ${fmtA(r.entregue_em.slice(0, 10))}. Comprovante assinado:</p>
      ${r.comprovante && urls[r.comprovante] ? `<img class="fotoret" src="${esc(urls[r.comprovante])}" alt="Comanda assinada" data-zoom="${esc(urls[r.comprovante])}">` : ''}</div>`;
    else if (S.perfil !== 'fabrica') entrega = `<div class="card stack" style="border:2px solid var(--rose)"><h2 style="margin:0">Entregar à consultora</h2>
      <p class="sub">Entregue as peças a ${esc(r.consultora)} e fotografe a comanda assinada por ela. Isso finaliza o conserto.</p>
      <div class="grid2"><label class="btn outline small" for="eCam">Fotografar comanda</label><label class="btn outline small" for="eGal">Da galeria</label></div>
      <input id="eCam" type="file" accept="image/*" capture="environment" hidden><input id="eGal" type="file" accept="image/*" hidden>
      <div id="ePrev"></div>
      <button class="btn green" data-act="entregar" id="bEntregar" disabled>Registrar entrega</button></div>`;
    else entrega = '<div class="card"><p class="sub">Aguardando a loja registrar a entrega à consultora.</p></div>';
  }
  let dev = '';
  if (fab && r.status === 'na_fabrica') {
    const bloq = r.modo_devolucao === 'completa' && falta.length > 0;
    dev = volt.length ? `<div class="card stack"><h2 style="margin:0">Devolução</h2>
      ${volt.map(p => `<label class="check"><input type="checkbox" name="dev" value="${p.id}" checked>${p.posicao} · ${GNOME[p.grupo]} · ${feitoTxt(p)}</label>`).join('')}
      ${bloq ? `<p class="sub">Devolução completa: ainda faltam ${falta.length} peça(s).</p>` : ''}
      <button class="btn green" data-act="devolver" ${bloq ? 'disabled' : ''}>Registrar devolução${r.fab_perfis ? ' · ' + esc(r.fab_perfis.nome) : ' à loja'}</button></div>`
      : `<div class="card"><p class="sub">Nenhuma peça voltou ainda. ${falta.length} em processo.</p></div>`;
  }

  $('#main').innerHTML = `
    <button class="link" data-ir="home">‹ Início</button>
    <div class="card stack">
      <div class="top2"><h1>${esc(reqNome(r))}</h1>${pillReq(r)}</div>
      ${r.cons_lotes ? `<button class="link" data-ir="lote" data-p="${r.cons_lotes.id}">${corChip(r.cons_lotes.cor_ordem, loteNome(r.cons_lotes))}</button>` : ''}
      <dl class="info">
        <div><dt>Consultora</dt><dd>${esc(r.consultora)}</dd></div>
        <div><dt>Loja</dt><dd>${esc(r.fab_perfis ? r.fab_perfis.nome : '—')}</dd></div>
        <div><dt>Recebido em</dt><dd>${fmtA(r.data_recebimento)}</dd></div>
        <div><dt>Entregar até</dt><dd>${fmtA(r.data_promessa)}</dd></div>
        <div><dt>Devolução</dt><dd>${r.modo_devolucao === 'parcial' ? 'Parcial' : 'Completa'}</dd></div>
        ${r.observacao ? `<div><dt>Observação</dt><dd>${esc(r.observacao)}</dd></div>` : ''}
      </dl>
    </div>
    <h2>Fotos</h2>${thumbs(fotos, urls)}
    ${r.ia_qtd_foto && r.ia_qtd_foto > pecas.length ? `<div class="card alerta stack" style="gap:6px"><b>A IA contou ${r.ia_qtd_foto} peças na foto, mas há ${pecas.length} lançadas.</b>
      ${r.ia_aviso ? `<span>Possível peça fora da lista: ${esc(r.ia_aviso)}</span>` : ''}<span class="s">Confira a foto e, se faltar, use "+ Adicionar peça".</span></div>` : ''}
    <h2>Peças (${pecas.length})</h2>
    ${conferir ? `<p class="sub">Confira a medida, a descrição e o serviço de cada peça.</p>${pecas.map(conf).join('')}<button class="btn" data-act="receber">Conferido · receber no lote de hoje</button>` : pecas.map(linha).join('')}
    ${custos}
    ${dev}
    ${entrega}
    ${fotos.length && (r.status === 'registrada' || fab) && r.status !== 'devolvida' ? `<button class="btn outline" data-act="descrever">Descrever de novo com a IA</button>` : ''}
    ${podeAdd ? `<button class="btn outline" data-act="addAbrir">+ Adicionar peça</button><div id="addBox"></div>` : ''}
    ${podeExcluir ? `<button class="btn outline" data-act="excluir">Excluir requisição</button>` : ''}`;
  const A = {grupo: '', medida: '', descricao: '', prev: 'limpeza', onde: 'com_jonatan', feito: 'banho', nf: false};
  function renderAdd() {
    const box = $('#addBox'); if (!box) return;
    const seg = (act, opts, atual) => `<div class="seg">${opts.map(([v, n]) => `<button type="button" class="segb ${atual === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${n}</button>`).join('')}</div>`;
    box.innerHTML = `<div class="card stack">
      <h2 style="margin:0">Adicionar peça à ${esc(reqNome(r))}</h2>
      <div class="field"><span class="lbl">Grupo</span><div class="grupos">${GRUPOS.map(([g, n]) => `<button type="button" class="chipbtn ${A.grupo === g ? 'on' : ''}" data-act="addG" data-v="${g}">${n}</button>`).join('')}</div></div>
      <div class="field"><label for="aDesc">Descrição</label><textarea id="aDesc" rows="3">${esc(A.descricao)}</textarea></div>
      <div class="field" style="max-width:220px"><label for="aMed">Medida</label><input id="aMed" value="${esc(A.medida)}" placeholder="${A.grupo ? PH[A.grupo] : ''}"></div>
      <div class="field"><span class="lbl">Serviço previsto</span>${seg('addPrev', SERV, A.prev)}</div>
      ${r.status === 'na_fabrica' && !A.nf ? `<div class="field"><span class="lbl">Onde a peça está agora?</span>${seg('addOnde', [['na_fabrica','Na fábrica'],['com_jonatan','Em manutenção'],['retornou','Já voltou']], A.onde)}</div>
        ${A.onde === 'retornou' ? `<div class="field"><span class="lbl">Serviço feito</span>${seg('addFeito', SERV, A.feito)}</div>` : ''}` : ''}
      <label class="check"><input type="checkbox" id="aNf" ${A.nf ? 'checked' : ''}><span><b>${NF}</b> · vai direto para o saquinho</span></label>
      <button type="button" class="btn" data-act="addSalvar">Salvar peça</button></div>`;
    $('#aNf').onchange = e => { A.nf = e.target.checked; renderAdd(); };
    $('#aDesc').oninput = e => A.descricao = e.target.value;
    $('#aMed').oninput = e => A.medida = e.target.value;
  }
  // Grava o que já foi digitado na conferência (para não perder ao adicionar/excluir peça)
  async function salvarDigitado() {
    for (const p of pecas) {
      const m = document.getElementById('m' + p.id), d = document.getElementById('d' + p.id);
      if (!m || !d) continue;
      const sel = document.querySelector(`input[name=s${p.id}]:checked`);
      const upd = {medida: m.value.trim() || null, descricao: d.value.trim() || null};
      if (sel) upd.servico_previsto = sel.value;
      const nf = document.getElementById('nf' + p.id); if (nf) upd.nao_fressen = nf.checked;
      const {error} = await sb.from('cons_pecas').update(upd).eq('id', p.id);
      if (error) throw error;
    }
  }
  ACT.editPeca = b => {
    const p = pecas.find(x => x.id === +b.dataset.id); if (!p) return;
    const el = document.getElementById('pc' + p.id);
    el.outerHTML = conf(p).replace(/<\/div>$/, `<div class="grid2"><button type="button" class="btn small" data-act="salvarPeca" data-id="${p.id}">Salvar</button><button type="button" class="btn outline small" data-ir="req" data-p="${r.id}">Cancelar</button></div></div>`);
    const t = document.getElementById('m' + p.id); if (t) t.focus();
  };
  ACT.salvarPeca = async b => {
    b.disabled = true;
    try { await salvarDigitado(); toast('Peça atualizada.'); ir('req', r.id); }
    catch (e) { b.disabled = false; toast(erroMsg(e), true); }
  };
  ACT.addAbrir = b => { b.hidden = true; renderAdd(); $('#addBox').scrollIntoView({behavior: 'smooth'}); };
  ACT.addG = b => { A.grupo = b.dataset.v; renderAdd(); };
  ACT.addPrev = b => { A.prev = b.dataset.v; renderAdd(); };
  ACT.addOnde = b => { A.onde = b.dataset.v; renderAdd(); };
  ACT.addFeito = b => { A.feito = b.dataset.v; renderAdd(); };
  ACT.addSalvar = async b => {
    if (!A.grupo) return toast('Escolha o grupo da peça.', true);
    b.disabled = true;
    try { await salvarDigitado(); } catch (e) { b.disabled = false; return toast(erroMsg(e), true); }
    const agora = new Date().toISOString();
    const status = r.status === 'na_fabrica' ? (A.nf ? 'na_fabrica' : A.onde) : 'registrada';
    const nova = {requisicao_id: r.id, posicao: Math.max(0, ...pecas.map(p => p.posicao)) + 1, grupo: A.grupo,
      medida: A.medida.trim() || null, descricao: A.descricao.trim() || null, servico_previsto: A.prev, status, lote_id: r.lote_id || null, nao_fressen: A.nf};
    if (status === 'com_jonatan' || status === 'retornou') nova.enviada_em = agora;
    if (status === 'retornou') { nova.servico_feito = A.feito; nova.retornou_em = agora; }
    const {error} = await sb.from('cons_pecas').insert(nova);
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    toast(`Peça adicionada à ${reqNome(r)}.`); ir('req', r.id);
  };
  if (ABRIR_ADD && podeAdd) { ABRIR_ADD = false; A.onde = 'retornou'; const bt = document.querySelector('[data-act=addAbrir]'); if (bt) ACT.addAbrir(bt); }
  ABRIR_ADD = false;

  ACT.receber = async b => {
    b.disabled = true; b.textContent = 'Recebendo…';
    try {
      for (const p of pecas) {
        const {error} = await sb.from('cons_pecas').update({
          medida: $('#m' + p.id).value.trim() || null, descricao: $('#d' + p.id).value.trim() || null,
          servico_previsto: document.querySelector(`input[name=s${p.id}]:checked`).value,
          nao_fressen: $('#nf' + p.id).checked
        }).eq('id', p.id);
        if (error) throw error;
      }
      const {data: lote, error} = await sb.rpc('cons_receber', {p_req: r.id});
      if (error) throw error;
      toast(`Recebida no lote ${n3(lote)}.`); ir('req', r.id);
    } catch (e) {
      b.disabled = false; b.textContent = 'Conferido · receber no lote de hoje';
      const k = erroMsg(e).match(/COR_OCUPADA:(\d+)/);
      toast(k ? `A próxima cor ainda está no lote ${n3(k[1])}. Abra esse lote e transfira as pendências para o Preto.` : erroMsg(e), true);
    }
  };
  ACT.descrever = async b => {
    b.disabled = true; b.textContent = 'A IA está descrevendo…';
    try { const d = await ia({acao: 'descrever', requisicao_id: r.id}); toast(`A IA descreveu ${d.gravadas} peça(s)${d.exemplos ? `, usando ${d.exemplos} correção(ões) da equipe` : ''}.`); ir('req', r.id); }
    catch (e) { b.disabled = false; b.textContent = 'Descrever de novo com a IA'; toast(erroMsg(e), true); }
  };
  ACT.salvarCustos = async b => {
    b.disabled = true;
    try {
      for (const p of pecas.filter(p => document.getElementById('c' + p.id))) {
        const v = lerValor($('#c' + p.id).value);
        if (v !== (p.custo == null ? null : Number(p.custo))) {
          const {error} = await sb.from('cons_pecas').update({custo: v}).eq('id', p.id);
          if (error) throw error;
        }
      }
      toast('Custos salvos.'); ir('req', r.id);
    } catch (e) { b.disabled = false; toast(erroMsg(e), true); }
  };
  let comp = null;
  const escolherComp = e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; comp = f;
    $('#ePrev').innerHTML = `<img class="fotoret" src="${URL.createObjectURL(f)}" alt="Comanda assinada">`; $('#bEntregar').disabled = false; };
  if ($('#eCam')) { $('#eCam').onchange = escolherComp; $('#eGal').onchange = escolherComp; }
  ACT.entregar = async b => {
    if (!comp) return toast('Fotografe a comanda assinada.', true);
    b.disabled = true; b.textContent = 'Enviando comprovante…';
    try {
      const caminho = `comprovante/${r.id}/${Date.now()}.jpg`;
      const {error: eu} = await sb.storage.from('consertos').upload(caminho, await comprimir(comp, 1600, 0.8), {contentType: 'image/jpeg'});
      if (eu) throw eu;
      const {error} = await sb.rpc('cons_registrar_entrega', {p_req: r.id, p_caminho: caminho});
      if (error) throw error;
      toast('Entrega registrada. Conserto finalizado.'); ir('req', r.id);
    } catch (e) { b.disabled = false; b.textContent = 'Registrar entrega'; toast(erroMsg(e), true); }
  };
  ACT.devolver = async b => {
    const ids = [...document.querySelectorAll('input[name=dev]:checked')].map(x => +x.value);
    if (!ids.length) return toast('Marque as peças que vão voltar.', true);
    if (!confirma(b)) return;
    b.disabled = true;
    const {error} = await sb.rpc('cons_devolver', {p_req: r.id, p_pecas: ids});
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    toast('Devolução registrada.'); ir('req', r.id);
  };
  ACT.delPeca = async b => {
    const p = pecas.find(x => x.id === +b.dataset.id); if (!p) return;
    if (!confirma(b)) return;
    b.disabled = true;
    try {
      await salvarDigitado();
      const {error} = await sb.from('cons_pecas').delete().eq('id', p.id);
      if (error) throw error;
      // renumera as peças seguintes para não ficar buraco (1, 2, 3…)
      for (const q of pecas.filter(q => q.posicao > p.posicao).sort((x, y) => x.posicao - y.posicao)) {
        const {error: e2} = await sb.from('cons_pecas').update({posicao: q.posicao - 1}).eq('id', q.id);
        if (e2) throw e2;
      }
      toast(`Peça ${p.posicao} · ${GNOME[p.grupo]} excluída da ${reqNome(r)}.`); ir('req', r.id);
    } catch (e) { b.disabled = false; toast(erroMsg(e), true); }
  };
  ACT.excluir = async b => {
    if (!confirma(b)) return;
    b.disabled = true;
    const {error} = await sb.from('cons_requisicoes').delete().eq('id', r.id);
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    if (fab && fotos.length) await sb.storage.from('consertos').remove(fotos.map(f => f.caminho));
    toast('Requisição excluída.'); ir('home');
  };
};

// ====== Lotes ======
function cardLote(l) {
  const pend = l.total - l.devolvida, du = l.cor_ordem > 0 && l.status === 'aberto' ? diaUtil(l.data_entrada) : null;
  return `<button class="row" data-ir="lote" data-p="${l.id}" style="align-items:flex-start">
    <div style="display:flex;gap:12px;align-items:flex-start;min-width:0;flex:1">${dot(l.cor_ordem, true)}
    <div class="stack" style="gap:4px;min-width:0;flex:1"><div class="t">${esc(loteNome(l))}</div>
    <div class="s">Entrada ${fmt(l.data_entrada)}${l.promessa ? ' · entregar até ' + fmt(l.promessa) : ''}${du ? ` · <span class="${du > 12 ? 'flag' : ''}">dia ${du} de 12</span>` : ''}</div>
    <div class="s">Fábrica ${l.na_fabrica} · Manutenção ${l.com_jonatan} · Voltaram ${l.retornou} · Devolvidas ${l.devolvida}/${l.total}</div>
    <div class="bar"><i style="width:${l.total ? Math.round(100 * l.devolvida / l.total) : 0}%"></i></div></div></div>
    <span class="pill ${l.status === 'aberto' ? (pend ? 'info' : 'ok') : 'ok'}">${l.status === 'aberto' ? pend + ' em aberto' : 'Fechado'}</span></button>`;
}
R.lotes = async () => {
  const [a, f] = await Promise.all([
    sb.from('cons_lotes_resumo').select('*').eq('status', 'aberto').order('id'),
    sb.from('cons_lotes_resumo').select('*').eq('status', 'fechado').order('id', {ascending: false}).limit(12)
  ]);
  if (a.error) throw a.error; if (f.error) throw f.error;
  $('#main').innerHTML = `
    <div><h1>Lotes</h1><p class="sub">Um lote por dia útil, na sequência das ${S.nCores} cores. O Preto é só para pendências.</p></div>
    <h2>Abertos (${a.data.length})</h2>${a.data.length ? a.data.map(cardLote).join('') : '<p class="vazio">Nenhum lote aberto.</p>'}
    <h2>Fechados recentes</h2>${f.data.length ? f.data.map(cardLote).join('') : '<p class="vazio">Nenhum lote fechado ainda.</p>'}`;
};

R.lote = async id => {
  const [ql, qp] = await Promise.all([
    sb.from('cons_lotes_resumo').select('*').eq('id', id).single(),
    sb.from('cons_pecas').select('*,cons_requisicoes(id,numero_formulario,consultora,data_promessa,modo_devolucao)').eq('lote_id', id).order('requisicao_id').order('posicao')
  ]);
  if (ql.error) throw ql.error; if (qp.error) throw qp.error;
  const l = ql.data, pecas = qp.data, fab = S.perfil !== 'executiva';
  const reqIds = [...new Set(pecas.map(p => p.requisicao_id))];
  let fotos = [];
  if (reqIds.length) { const q = await sb.from('cons_fotos').select('*').in('requisicao_id', reqIds).eq('tipo', 'chegada').order('id'); if (q.error) throw q.error; fotos = q.data; }
  const urls = await assinar(fotos.map(f => f.caminho));
  const F = {aba: 'aguardando', grupo: ''};
  const emProc = p => ['na_fabrica','com_jonatan'].includes(p.status);

  function render() {
    const c = k => pecas.filter(p => p.status === k).length;
    const pend = pecas.filter(p => p.status !== 'devolvida').length;
    const grupos = [...new Set(pecas.map(p => p.grupo))].sort((a, b) => ordemG(a) - ordemG(b));
    const filtro = pecas.filter(p => (!F.grupo || p.grupo === F.grupo) && (F.aba === 'todas' || (F.aba === 'aguardando' ? emProc(p) : p.status === 'retornou')));
    const porReq = {}; filtro.forEach(p => (porReq[p.requisicao_id] = porReq[p.requisicao_id] || []).push(p));
    const du = l.cor_ordem > 0 && l.status === 'aberto' ? diaUtil(l.data_entrada) : null;
    const aberto = l.status === 'aberto';
    const acoes = !fab || !aberto ? '' : [
      c('com_jonatan') + c('na_fabrica') ? `<button class="btn" data-ir="retorno" data-p="${l.id}">Identificar retorno com a IA</button>` : '',
      c('na_fabrica') ? `<button class="btn dark" data-act="enviar">Enviar ${c('na_fabrica')} peça(s) para manutenção · pote ${esc(cor(l.cor_ordem).nome.toLowerCase())}</button>` : '',
      l.cor_ordem > 0 && pend ? `<button class="btn outline" data-act="transferir">Transferir ${pend} pendência(s) para o Preto</button>` : '',
      !pend && pecas.length ? `<button class="btn" data-act="fechar">Fechar lote</button>` : ''
    ].join('');
    const linhaP = p => {
      let acao;
      if (fab && emProc(p) && aberto) acao = `<span class="lbl">Voltou com:</span><div class="acoes3">${SERV.map(([s, n]) => `<button data-act="voltou" data-id="${p.id}" data-v="${s}">${n}</button>`).join('')}</div>`;
      else if (p.status === 'retornou' && p.nao_fressen) acao = `<span class="pill warn" style="align-self:flex-start">${NF} · no saquinho</span>`;
      else if (p.status === 'retornou') acao = `<div class="top2"><span class="pill ok">Voltou · ${SNOME[p.servico_feito] || ''}</span>${fab ? `<button class="link" data-act="desfazer" data-id="${p.id}">Desfazer</button>` : ''}</div>`;
      else acao = `<span class="pill ${ST[p.status][1]}" style="align-self:flex-start">${ST[p.status][0]}</span>`;
      return `<div class="pecarow"><div><b>${p.posicao} · ${GNOME[p.grupo]}</b>${p.medida ? ' · ' + esc(p.medida) : ''}${emProc(p) ? ` <span class="pill ${ST[p.status][1]}">${ST[p.status][0]}</span>` : ''}
        ${p.descricao ? `<div>${esc(p.descricao)}</div>` : ''}<div class="s">Previsto: ${SNOME[p.servico_previsto] || '—'}</div></div>${acao}</div>`;
    };
    const bloco = ([rid, ps]) => {
      const r = ps[0].cons_requisicoes, fs = fotos.filter(f => f.requisicao_id == rid);
      return `<div class="card stack" style="gap:10px"><div class="top2"><button class="link" data-ir="req" data-p="${rid}">${esc(reqNome(r))} · ${esc(r.consultora)}</button><span class="s">até ${fmt(r.data_promessa)}</span></div>
        ${fs.length ? thumbs(fs, urls) : ''}${ps.map(linhaP).join('')}</div>`;
    };
    $('#main').innerHTML = `
      <button class="link" data-ir="lotes">‹ Lotes</button>
      <div class="card stack">
        <div class="top2"><div style="display:flex;gap:10px;align-items:center">${dot(l.cor_ordem, true)}<h1>${esc(loteNome(l))}</h1></div><span class="pill ${aberto ? 'info' : 'ok'}">${aberto ? 'Aberto' : 'Fechado'}</span></div>
        <p class="sub">Entrada ${fmtA(l.data_entrada)}${l.promessa ? ' · entregar até ' + fmt(l.promessa) : ''}${du ? ` · <span class="${du > 12 ? 'flag' : ''}">dia útil ${du} de 12</span>` : ''}</p>
        <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center">
          <div><b>${c('na_fabrica')}</b><div class="s">Conferidas</div></div><div><b>${c('com_jonatan')}</b><div class="s">Manutenção</div></div>
          <div><b>${c('retornou')}</b><div class="s">Voltaram</div></div><div><b>${c('devolvida')}</b><div class="s">Devolvidas</div></div></div>
      </div>
      ${acoes}
      <div class="tabs">${[['aguardando','Aguardando'],['voltaram','Voltaram'],['todas','Todas']].map(([v, t]) => `<button class="${F.aba === v ? 'on' : ''}" data-act="aba" data-v="${v}">${t}</button>`).join('')}</div>
      ${grupos.length > 1 ? `<div class="grupos"><button class="chipbtn ${!F.grupo ? 'on' : ''}" data-act="grupo" data-v="">Todos</button>${grupos.map(g => `<button class="chipbtn ${F.grupo === g ? 'on' : ''}" data-act="grupo" data-v="${g}">${GNOME[g]}</button>`).join('')}</div>` : ''}
      ${Object.keys(porReq).length ? Object.entries(porReq).map(bloco).join('') : '<p class="vazio">Nenhuma peça neste filtro.</p>'}`;
  }
  render();

  ACT.aba = b => { F.aba = b.dataset.v; render(); };
  ACT.grupo = b => { F.grupo = b.dataset.v; render(); };
  ACT.voltou = async b => {
    const p = pecas.find(x => x.id == b.dataset.id); b.disabled = true;
    const upd = {status: 'retornou', servico_feito: b.dataset.v, retornou_em: new Date().toISOString()};
    const {error} = await sb.from('cons_pecas').update(upd).eq('id', p.id);
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    Object.assign(p, upd); toast(`${GNOME[p.grupo]} → saquinho ${reqNome(p.cons_requisicoes)}`); render();
  };
  ACT.desfazer = async b => {
    const p = pecas.find(x => x.id == b.dataset.id);
    const upd = {status: p.enviada_em ? 'com_jonatan' : 'na_fabrica', servico_feito: null, retornou_em: null};
    const {error} = await sb.from('cons_pecas').update(upd).eq('id', p.id);
    if (error) return toast(erroMsg(error), true);
    Object.assign(p, upd); render();
  };
  ACT.enviar = async b => {
    b.disabled = true; const agora = new Date().toISOString();
    const {error} = await sb.from('cons_pecas').update({status: 'com_jonatan', enviada_em: agora}).eq('lote_id', l.id).eq('status', 'na_fabrica');
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    pecas.forEach(p => { if (p.status === 'na_fabrica') { p.status = 'com_jonatan'; p.enviada_em = agora; } });
    toast('Peças enviadas para manutenção.'); render();
  };
  ACT.transferir = async b => {
    if (!confirma(b)) return; b.disabled = true;
    const {data, error} = await sb.rpc('cons_transferir_pendencias', {p_lote: l.id});
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    toast(`${data} peça(s) foram para o lote Preto. A cor ${cor(l.cor_ordem).nome} está livre.`); ir('lotes');
  };
  ACT.fechar = async b => {
    b.disabled = true;
    const {error} = await sb.from('cons_lotes').update({status: 'fechado', fechado_em: new Date().toISOString()}).eq('id', l.id);
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    toast('Lote fechado.'); ir('lotes');
  };
};

// ====== Retorno do Jonatan (limpeza, banho, flash) com IA ======
R.retorno = async loteId => {
  const [ql, qlog] = await Promise.all([
    sb.from('cons_lotes_resumo').select('*').eq('status', 'aberto').order('id'),
    sb.from('cons_ia_log').select('posicao_ia').order('id', {ascending: false}).limit(300)
  ]);
  if (ql.error) throw ql.error;
  const lotes = ql.data.filter(l => l.na_fabrica + l.com_jonatan > 0);
  const logs = qlog.data || [];
  const E = {lote: null, pend: [], fotosReq: {}, urls: {}, grupo: '', medida: '', fotoUrl: '', busy: '', cands: null, info: '', manual: false, escolha: null, serv: 'limpeza',
    modo: 'peca', qtd: '', gres: null, gsel: {}, gserv: {}, gok: {}, resumo: null};
  const peca = id => E.pend.find(p => p.id === id);

  async function abrirLote(l) {
    Object.assign(E, {lote: l, grupo: '', cands: null, escolha: null, fotoUrl: '', manual: false, busy: 'Carregando as peças do lote…'}); render();
    try {
      const qp = await sb.from('cons_pecas').select('*,cons_requisicoes(id,numero_formulario,consultora,data_promessa)').eq('lote_id', l.id).in('status', ['na_fabrica','com_jonatan']).order('requisicao_id').order('posicao');
      if (qp.error) throw qp.error;
      E.pend = qp.data;
      const ids = [...new Set(E.pend.map(p => p.requisicao_id))];
      let fotos = [];
      if (ids.length) { const qf = await sb.from('cons_fotos').select('*').in('requisicao_id', ids).eq('tipo', 'chegada').order('id'); if (qf.error) throw qf.error; fotos = qf.data; }
      E.fotosReq = {}; fotos.forEach(f => (E.fotosReq[f.requisicao_id] = E.fotosReq[f.requisicao_id] || []).push(f));
      E.urls = await assinar(fotos.flatMap(f => [f.caminho, f.caminho_ia]).filter(Boolean));
      const qr = await sb.from('cons_requisicoes').select('id,numero_formulario,consultora').eq('lote_id', l.id).order('id');
      E.reqsLote = qr.data || [];
    } catch (e) { toast(erroMsg(e), true); }
    E.busy = ''; render();
  }

  function cartao(p, extra) {
    const r = p.cons_requisicoes, f = (E.fotosReq[p.requisicao_id] || [])[0];
    const img = f ? `<img src="${esc(E.urls[f.caminho_ia || f.caminho] || '')}" alt="Foto de chegada" data-zoom="${esc(E.urls[f.caminho] || '')}">` : '';
    return `<div class="cand ${E.escolha === p.id ? 'on' : ''}">${img}<button class="cand-b" data-act="escolher" data-id="${p.id}">
      <span class="t">${esc(reqNome(r))} · ${esc(r.consultora)}</span>
      <span>Peça ${p.posicao} · ${GNOME[p.grupo]}${p.medida ? ' · ' + esc(p.medida) : ''}</span>
      ${p.descricao ? `<span class="s">${esc(p.descricao)}</span>` : ''}${extra || ''}</button></div>`;
  }

  function render() {
    const tot = logs.length, t1 = logs.filter(x => x.posicao_ia === 1).length, t3 = logs.filter(x => x.posicao_ia >= 1 && x.posicao_ia <= 3).length;
    const grupos = {}; E.pend.forEach(p => grupos[p.grupo] = (grupos[p.grupo] || 0) + 1);
    const doGrupo = E.pend.filter(p => p.grupo === E.grupo);
    const esc1 = E.escolha && peca(E.escolha);
    let h = `<div><h1>Retorno da manutenção</h1><p class="sub">Peças que voltaram da limpeza, do banho ou do flash. Fotografe uma peça por vez e a IA indica de qual requisição ela é.</p></div>
      ${tot ? `<div class="card s">Acerto da IA até agora: em 1º lugar <b>${t1} de ${tot}</b> · entre as 3 sugestões <b>${t3} de ${tot}</b></div>` : ''}
      <h2>1. Lote (cor do pote)</h2>
      ${lotes.length ? `<div class="grupos">${lotes.map(l => `<button class="chipbtn ${E.lote && E.lote.id === l.id ? 'on' : ''}" data-act="lote" data-v="${l.id}" style="display:inline-flex;align-items:center;gap:6px">${dot(l.cor_ordem)}${esc(cor(l.cor_ordem).nome)} · ${n3(l.id)} <span class="s">${l.na_fabrica + l.com_jonatan}</span></button>`).join('')}</div>` : '<p class="vazio">Nenhum lote com peças aguardando retorno.</p>'}`;
    if (E.busy && !E.grupo) h += `<div class="ia"><i></i>${esc(E.busy)}</div>`;
    if (E.lote && !(E.busy && !E.grupo)) {
      h += `<h2>2. Grupo da peça</h2>${Object.keys(grupos).length ? `<div class="grupos">${Object.entries(grupos).sort((a, b) => ordemG(a[0]) - ordemG(b[0])).map(([g, n]) => `<button class="chipbtn ${E.grupo === g ? 'on' : ''}" data-act="grupo" data-v="${g}">${GNOME[g]} · ${n}</button>`).join('')}</div>` : '<p class="vazio">Todas as peças deste lote já voltaram.</p>'}`;
    }
    if (E.lote && E.grupo) {
      h += `<h2>3. Como fotografar</h2><div class="seg two"><button type="button" class="segb ${E.modo === 'peca' ? 'on' : ''}" data-act="modo" data-v="peca">Peça por peça</button><button type="button" class="segb ${E.modo === 'grupo' ? 'on' : ''}" data-act="modo" data-v="grupo">Em grupo</button></div>`;
      if (E.resumo) h += `<div class="card stack" style="gap:6px;background:var(--ok-soft)"><b>Registradas. Coloque cada peça no saquinho:</b>${E.resumo.map(x => `<span>Posição ${x.pos} → <b>${esc(x.req)}</b> · ${esc(x.serv)}</span>`).join('')}</div>`;
    }
    if (E.lote && E.grupo && E.modo === 'peca') {
      h += `<h2>4. Foto da peça que voltou</h2>
        <div class="dica">Uma peça por foto, sobre o tapete com a régua, celular reto, de cima.</div>
        <div class="field"><label for="tMed">Medida (opcional, ajuda a IA)</label><input id="tMed" value="${esc(E.medida)}" placeholder="${PH[E.grupo]}"></div>
        <div class="grid2"><label class="btn outline small" for="tCam">Tirar foto</label><label class="btn outline small" for="tGal">Da galeria</label></div>
        <input id="tCam" type="file" accept="image/*" capture="environment" hidden><input id="tGal" type="file" accept="image/*" hidden>
        ${E.fotoUrl ? `<img class="fotoret" src="${E.fotoUrl}" alt="Peça que voltou" data-zoom="${E.fotoUrl}">` : ''}
        ${E.busy ? `<div class="ia"><i></i>${esc(E.busy)}</div>` : ''}`;
      if (E.cands) {
        h += `<h2>5. Confirme a peça</h2>${E.info ? `<p class="sub">${esc(E.info)}</p>` : ''}
          ${E.cands.length ? E.cands.map(c => peca(c.peca_id) ? cartao(peca(c.peca_id), `<span class="s"><span class="conf">${c.confianca}%</span> · ${esc(c.motivo)}</span>`) : '').join('') : '<p class="vazio">A IA não encontrou uma peça parecida.</p>'}
          <button class="link" data-act="manual">${E.manual ? 'Esconder a lista' : `Nenhuma destas · ver as ${doGrupo.length} peças do grupo`}</button>
          ${E.manual ? doGrupo.map(p => cartao(p)).join('') : ''}`;
      } else if (!E.busy) {
        h += `<button class="link" data-act="manual">${E.manual ? 'Esconder a lista' : `Escolher sem a IA · ver as ${doGrupo.length} peças do grupo`}</button>${E.manual ? doGrupo.map(p => cartao(p)).join('') : ''}`;
      }
      if (esc1) {
        h += `<div class="card stack"><b>Voltou com qual serviço?</b>
          <div class="seg">${SERV.map(([s, n]) => `<button type="button" class="segb ${E.serv === s ? 'on' : ''}" data-act="serv" data-v="${s}">${n}</button>`).join('')}</div>
          ${consumoTxt(esc1.grupo, E.serv) ? `<span class="s">${consumoTxt(esc1.grupo, E.serv)}</span>` : ''}
          <button class="btn green" data-act="confirmar">Confirmar · saquinho ${esc(reqNome(esc1.cons_requisicoes))}</button></div>`;
      }
    }
    if (E.lote && E.grupo && E.modo === 'grupo') {
      const doG = E.pend.filter(p => p.grupo === E.grupo);
      h += `<h2>4. Foto do grupo</h2>
        <div class="dica">Coloque até 12 peças deste grupo no tapete, cada uma ao lado de um número (1, 2, 3…), com a régua embaixo. Correntes: no máximo 6, esticadas.</div>
        <div class="field" style="max-width:240px"><label for="gQtd">Quantas peças na foto?</label><input id="gQtd" type="number" min="1" max="15" inputmode="numeric" value="${esc(E.qtd)}" placeholder="ex.: 8"></div>
        <div class="grid2"><label class="btn outline small" for="tCam">Tirar foto</label><label class="btn outline small" for="tGal">Da galeria</label></div>
        <input id="tCam" type="file" accept="image/*" capture="environment" hidden><input id="tGal" type="file" accept="image/*" hidden>
        ${E.fotoUrl ? `<img class="fotoret" src="${E.fotoUrl}" alt="Grupo que voltou" data-zoom="${E.fotoUrl}">` : ''}
        ${E.busy ? `<div class="ia"><i></i>${esc(E.busy)}</div>` : ''}`;
      if (E.gres) {
        const cont = {}; Object.values(E.gsel).forEach(v => { if (v) cont[v] = (cont[v] || 0) + 1; });
        const dup = new Set(Object.keys(cont).filter(k => cont[k] > 1).map(Number));
        const n = Object.values(E.gsel).filter(Boolean).length;
        const nok = E.gres.filter(pos => E.gok[pos.posicao] && E.gsel[pos.posicao]).length;
        h += `<h2>5. Confira cada posição</h2>
          <p class="sub">Toque em "No saquinho" quando a peça já estiver no saquinho certo. As que ficarem em dúvida continuam aqui.</p>
          <div class="contador"><span>${nok} de ${E.gres.length} no saquinho</span><button type="button" class="link" data-act="gtodas">${nok === n && n ? 'Desmarcar todas' : 'Marcar todas'}</button></div>
          ${E.gres.map(pos => cartaoPos(pos, dup, doG)).join('')}
          <button class="btn green" data-act="gconfirmar" ${nok ? '' : 'disabled'}>Registrar ${nok} peça(s) no saquinho</button>`;
      }
    }
    if (E.lote && !E.busy) {
      h += `<div class="card stack" style="gap:8px"><button type="button" class="link" data-act="faltou">${E.faltou ? 'Fechar' : 'Peça não aparece na lista? Adicionar a uma requisição'}</button>
        ${E.faltou ? `<p class="sub">Escolha a requisição da peça (pelo formulário ou saquinho). Ela será adicionada já como "voltou".</p>
          ${(E.reqsLote || []).map(rq => `<button type="button" class="row" data-act="addreq" data-p="${rq.id}"><span class="t">${esc(reqNome(rq))} · ${esc(rq.consultora)}</span><span class="pill neutro">Adicionar</span></button>`).join('') || '<p class="vazio">Nenhuma requisição neste lote.</p>'}` : ''}</div>`;
    }
    $('#main').innerHTML = h;
    if (E.lote && E.grupo) {
      const med = $('#tMed'); if (med) med.oninput = e => E.medida = e.target.value;
      const q = $('#gQtd'); if (q) q.oninput = e => E.qtd = e.target.value;
      $('#tCam').onchange = $('#tGal').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) (E.modo === 'grupo' ? identificarGrupo(f) : identificar(f)); };
      document.querySelectorAll('select[data-gpos]').forEach(sel => sel.onchange = () => {
        const pos = sel.dataset.gpos, v = +sel.value || null; E.gsel[pos] = v; E.gok[pos] = false;
        if (v && !E.gserv[pos]) E.gserv[pos] = peca(v).servico_previsto || 'limpeza';
        render();
      });
    }
  }

  function cartaoPos(pos, dup, doG) {
    const sel = E.gsel[pos.posicao] || null, p = sel ? peca(sel) : null;
    const cands = pos.candidatos.filter(c => peca(c.peca_id));
    const opt = (q, extra) => `<option value="${q.id}" ${sel === q.id ? 'selected' : ''}>${esc(reqNome(q.cons_requisicoes))} · peça ${q.posicao}${q.medida ? ' · ' + esc(q.medida) : ''}${extra || ''}</option>`;
    const outras = doG.filter(q => !cands.some(c => c.peca_id === q.id));
    const opts = cands.map(c => opt(peca(c.peca_id), ` · ${c.confianca}%`)).join('')
      + (outras.length ? `<optgroup label="Outras peças do grupo">${outras.map(q => opt(q)).join('')}</optgroup>` : '')
      + `<option value="" ${!sel ? 'selected' : ''}>Deixar para depois</option>`;
    const c1 = cands.find(c => c.peca_id === sel), f = p ? (E.fotosReq[p.requisicao_id] || [])[0] : null;
    const ok = !!(E.gok[pos.posicao] && sel);
    const chk = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
    return `<div class="card stack ${ok ? 'posok' : ''}" style="gap:8px${dup.has(sel) ? ';border-color:var(--bad)' : ''}">
      <div class="top2"><b>Posição ${pos.posicao}${ok ? ' · no saquinho ' + esc(reqNome(p.cons_requisicoes)) : ''}</b>${!cands.length ? '<span class="pill warn">IA sem sugestão</span>' : ''}</div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        ${f ? `<img src="${esc(E.urls[f.caminho_ia || f.caminho] || '')}" alt="Foto de chegada" data-zoom="${esc(E.urls[f.caminho] || '')}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:zoom-in;flex-shrink:0">` : ''}
        <div class="stack" style="gap:6px;flex:1;min-width:0">
          <select id="gp${pos.posicao}" data-gpos="${pos.posicao}" aria-label="Requisição da posição ${pos.posicao}">${opts}</select>
          ${p && p.descricao ? `<span class="s">${esc(p.descricao)}</span>` : ''}${c1 && c1.motivo ? `<span class="s">IA: ${esc(c1.motivo)}</span>` : ''}
        </div></div>
      ${p ? `<div class="seg">${SERV.map(([sv, n]) => `<button type="button" class="segb ${E.gserv[pos.posicao] === sv ? 'on' : ''}" data-act="gserv" data-pos="${pos.posicao}" data-v="${sv}">${n}</button>`).join('')}</div>
        ${consumoTxt(p.grupo, E.gserv[pos.posicao]) ? `<span class="s">${consumoTxt(p.grupo, E.gserv[pos.posicao])}</span>` : ''}` : ''}
      ${dup.has(sel) ? '<span class="flag">Mesma peça escolhida em outra posição</span>' : ''}
      ${p ? `<button type="button" class="okbtn ${ok ? 'on' : ''}" data-act="gok" data-pos="${pos.posicao}" aria-pressed="${ok}">${chk}${ok ? 'No saquinho' : 'Marcar: está no saquinho'}</button>` : ''}</div>`;
  }

  async function identificarGrupo(file) {
    const qtd = parseInt(E.qtd, 10);
    if (!(qtd >= 1 && qtd <= 15)) return toast('Informe quantas peças há na foto (1 a 15).', true);
    const nPend = E.pend.filter(p => p.grupo === E.grupo).length;
    Object.assign(E, {gres: null, gsel: {}, gserv: {}, gok: {}, resumo: null, fotoUrl: URL.createObjectURL(file), busy: `A IA está comparando ${qtd} peça(s) com ${nPend} pendente(s) do grupo…`});
    render();
    try {
      const foto = await b64(await comprimir(file, 2000, 0.85));
      const d = await ia({acao: 'identificar_grupo', lote_id: E.lote.id, grupo: E.grupo, foto, quantidade: qtd});
      E.gres = d.posicoes || []; if (d.aviso) toast(d.aviso, true);
      const usados = new Set();
      E.gres.forEach(pp => { const c = pp.candidatos.find(c => peca(c.peca_id) && !usados.has(c.peca_id));
        if (c) { E.gsel[pp.posicao] = c.peca_id; usados.add(c.peca_id); E.gserv[pp.posicao] = peca(c.peca_id).servico_previsto || 'limpeza'; } });
    } catch (e) { E.gres = null; toast(erroMsg(e), true); }
    E.busy = ''; render();
  }

  async function identificar(file) {
    Object.assign(E, {cands: null, escolha: null, manual: false, info: '', fotoUrl: URL.createObjectURL(file)});
    const nReq = new Set(E.pend.filter(p => p.grupo === E.grupo).map(p => p.requisicao_id)).size;
    E.busy = `A IA está comparando com ${E.pend.filter(p => p.grupo === E.grupo).length} peça(s) de ${nReq} requisição(ões)…`; render();
    try {
      const foto = await b64(await comprimir(file, 1600, 0.85));
      const d = await ia({acao: 'identificar', lote_id: E.lote.id, grupo: E.grupo, medida: E.medida.trim() || null, foto});
      E.cands = d.candidatos || []; E.info = d.aviso || '';
      if (E.cands.length && peca(E.cands[0].peca_id)) { E.escolha = E.cands[0].peca_id; E.serv = peca(E.escolha).servico_previsto || 'limpeza'; }
    } catch (e) { E.cands = []; toast(erroMsg(e), true); }
    E.busy = ''; render();
  }

  ACT.lote = b => abrirLote(lotes.find(l => l.id == b.dataset.v));
  ACT.grupo = b => { Object.assign(E, {grupo: b.dataset.v, cands: null, escolha: null, fotoUrl: '', manual: false, medida: ''}); render(); };
  ACT.manual = () => { E.manual = !E.manual; render(); };
  ACT.faltou = () => { E.faltou = !E.faltou; render(); };
  ACT.addreq = b => { ABRIR_ADD = true; ir('req', b.dataset.p); };
  ACT.escolher = b => { E.escolha = +b.dataset.id; E.serv = peca(E.escolha).servico_previsto || 'limpeza'; render(); };
  ACT.serv = b => { E.serv = b.dataset.v; render(); };
  ACT.modo = b => { Object.assign(E, {modo: b.dataset.v, cands: null, escolha: null, gres: null, gsel: {}, gserv: {}, resumo: null, fotoUrl: '', manual: false}); render(); };
  ACT.gserv = b => { E.gserv[b.dataset.pos] = b.dataset.v; render(); };
  ACT.gok = b => { const pos = b.dataset.pos; E.gok[pos] = !E.gok[pos]; render(); };
  ACT.gtodas = () => { const comSel = E.gres.filter(x => E.gsel[x.posicao]); const todas = comSel.every(x => E.gok[x.posicao]);
    comSel.forEach(x => E.gok[x.posicao] = !todas); render(); };
  ACT.gconfirmar = async b => {
    const itens = Object.entries(E.gsel).filter(([pos, v]) => v && E.gok[pos]);
    const ids = itens.map(([, v]) => v);
    if (!itens.length) return toast('Marque as peças que já estão no saquinho.', true);
    if (new Set(ids).size !== ids.length) return toast('A mesma peça está em duas posições. Corrija antes de registrar.', true);
    b.disabled = true; const resumo = [];
    try {
      for (const [pos, id] of itens) {
        const p = peca(id), serv = E.gserv[pos] || p.servico_previsto || 'limpeza';
        const {error} = await sb.from('cons_pecas').update({status: 'retornou', servico_feito: serv, retornou_em: new Date().toISOString()}).eq('id', id);
        if (error) throw error;
        const pp = E.gres.find(x => x.posicao == pos), rank = pp.candidatos.findIndex(c => c.peca_id === id) + 1;
        await sb.from('cons_ia_log').insert({lote_id: E.lote.id, grupo: E.grupo, candidatos: pp.candidatos, peca_escolhida: id, posicao_ia: rank});
        logs.unshift({posicao_ia: rank});
        const l = lotes.find(x => x.id === E.lote.id); if (l) { if (p.status === 'na_fabrica') l.na_fabrica--; else l.com_jonatan--; }
        E.pend = E.pend.filter(x => x.id !== id);
        resumo.push({pos, req: reqNome(p.cons_requisicoes), serv: SNOME[serv]});
      }
      toast(`${resumo.length} peça(s) registradas.`);
    } catch (e) { toast(erroMsg(e), true); }
    const feitas = new Set(resumo.map(x => String(x.pos)));
    const restantes = (E.gres || []).filter(x => !feitas.has(String(x.posicao)));
    feitas.forEach(pos => { delete E.gsel[pos]; delete E.gserv[pos]; delete E.gok[pos]; });
    const pendIds = new Set(E.pend.map(x => x.id));
    restantes.forEach(x => { if (E.gsel[x.posicao] && !pendIds.has(E.gsel[x.posicao])) { E.gsel[x.posicao] = null; E.gok[x.posicao] = false; } });
    if (restantes.length) Object.assign(E, {gres: restantes, resumo: resumo.length ? resumo : null});
    else Object.assign(E, {gres: null, gsel: {}, gserv: {}, gok: {}, fotoUrl: '', qtd: '', resumo: resumo.length ? resumo : null});
    if (restantes.length && resumo.length) toast(`${resumo.length} registradas. ${restantes.length} posição(ões) continuam para conferir.`);
    render();
  };
  ACT.confirmar = async b => {
    const p = peca(E.escolha); if (!p) return;
    b.disabled = true;
    const upd = {status: 'retornou', servico_feito: E.serv, retornou_em: new Date().toISOString()};
    const {error} = await sb.from('cons_pecas').update(upd).eq('id', p.id);
    if (error) { b.disabled = false; return toast(erroMsg(error), true); }
    if (E.cands) {
      const pos = E.cands.findIndex(c => c.peca_id === p.id) + 1;
      await sb.from('cons_ia_log').insert({lote_id: E.lote.id, grupo: E.grupo, candidatos: E.cands, peca_escolhida: p.id, posicao_ia: pos});
      logs.unshift({posicao_ia: pos});
    }
    E.pend = E.pend.filter(x => x.id !== p.id);
    const l = lotes.find(x => x.id === E.lote.id); if (l) { if (p.status === 'na_fabrica') l.na_fabrica--; else l.com_jonatan--; }
    toast(`${GNOME[p.grupo]} → saquinho ${reqNome(p.cons_requisicoes)} (${SNOME[E.serv]})`);
    Object.assign(E, {cands: null, escolha: null, fotoUrl: '', manual: false, medida: ''});
    if (!E.pend.some(x => x.grupo === E.grupo)) E.grupo = '';
    render();
  };

  render();
  const ini = lotes.find(l => l.id == loteId);
  if (ini) abrirLote(ini);
};

// ====== Painel (fábrica) e Dashboard (gestão) ======
const ymd = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const mesDe = (ano, mes) => ({ini: ymd(new Date(ano, mes, 1, 12)), fim: ymd(new Date(ano, mes + 1, 0, 12))});
const PER = (() => { const h = new Date(); return {...mesDe(h.getFullYear(), h.getMonth()), atalho: 'mes'}; })();
R.painel = async () => {
  const {data: d, error} = await sb.rpc('cons_painel_periodo', {p_ini: PER.ini, p_fim: PER.fim});
  if (error) throw error;
  const g = S.perfil === 'gestao', t = d.tempos || {}, c = d.consumo || {}, vv = d.valores || {};
  const dias = v => v == null ? '—' : String(v).replace('.', ',') + ' dia' + (Number(v) === 1 ? '' : 's');
  const barras = (lista, rotulo, valor, sufixo, fv) => {
    const max = Math.max(1, ...lista.map(valor)), tot = lista.reduce((a, x) => a + valor(x), 0) || 1;
    return lista.length ? lista.map(x => `<div class="hbar"><span>${esc(rotulo(x))}</span><b>${fv ? fv(valor(x)) : valor(x)}${sufixo ? ' ' + sufixo : ''} <span class="s">· ${Math.round(100 * valor(x) / tot)}%</span></b><div class="trilho"><i style="width:${Math.round(100 * valor(x) / max)}%"></i></div></div>`).join('') : '<p class="vazio">Sem dados no período.</p>';
  };
  const cardLotePct = l => {
    const conc = l.prontas + l.devolvidas, pct = l.total ? Math.round(100 * conc / l.total) : 0;
    const anda = l.total - conc - l.a_receber, du = diaUtil(l.data_entrada);
    return `<button class="row" data-ir="lote" data-p="${l.id}" style="align-items:center">
      <div style="display:flex;gap:12px;align-items:center;min-width:0;flex:1">${dot(l.cor_ordem, true)}
        <div class="stack" style="gap:5px;flex:1;min-width:0">
          <div class="top2"><span class="t">${esc(loteNome(l))}</span><span class="s ${du > 12 ? 'flag' : ''}">dia ${du} de 12</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="s">${l.prontas} pronta(s) · ${l.devolvidas} devolvida(s) · ${anda} em andamento${l.a_receber ? ' · ' + l.a_receber + ' a receber' : ''} · ${l.total} requisição(ões)</div>
        </div></div>
      <span class="pct" style="color:${pct === 100 ? 'var(--ok)' : 'var(--ink)'}">${pct}%</span></button>`;
  };
  $('#main').innerHTML = `
    <div><h1>${g ? 'Painel de gestão' : 'Painel da fábrica'}</h1><p class="sub">Andamento dos lotes e tempo de cada etapa.</p></div>
    <div class="card stack" style="gap:10px">
      <div class="segp">${[['mes','Este mês'],['anterior','Mês passado'],['7d','Últimos 7 dias'],['tudo','Tudo']].map(([v, n]) => `<button type="button" class="segb ${PER.atalho === v ? 'on' : ''}" data-act="atalho" data-v="${v}">${n}</button>`).join('')}</div>
      <div class="field"><label for="pMes">Escolher um mês</label><input id="pMes" type="month" value="${PER.ini ? PER.ini.slice(0, 7) : ''}"></div>
      <div class="grid2">
        <div class="field"><label for="pIni">De</label><input id="pIni" type="date" value="${PER.ini || ''}"></div>
        <div class="field"><label for="pFim">Até</label><input id="pFim" type="date" value="${PER.fim || ''}"></div>
      </div>
      <button type="button" class="btn outline small" data-act="aplicar">Aplicar datas</button>
      <p class="s" style="margin:0">Mostrando: <b>${PER.ini ? fmtA(PER.ini) + ' a ' + fmtA(PER.fim) : 'todo o período'}</b></p>
    </div>

    <h2>Andamento dos lotes</h2>
    <p class="sub">% = requisições prontas ou devolvidas sobre o total do lote.</p>
    ${d.lotes.length ? d.lotes.map(cardLotePct).join('') : '<p class="vazio">Nenhum lote aberto.</p>'}

    <h2>Tempo de cada etapa</h2>
    <p class="sub">Requisições devolvidas no período: ${t.devolvidas || 0} · abertas no período: ${t.abertas_periodo || 0}.</p>
    <div class="kpis">
      <div class="kpi"><b>${dias(t.total)}</b><span>tempo total médio · da abertura da requisição até a devolução</span></div>
      <div class="kpi"><b>${dias(t.fabrica)}</b><span>tempo na fábrica · do aceite da Fran até a devolução</span></div>
      <div class="kpi"><b>${dias(t.loja_ate_aceite)}</b><span>da abertura na loja até o aceite da fábrica</span></div>
      <div class="kpi"><b style="color:${t.atrasadas ? 'var(--bad)' : 'inherit'}">${t.atrasadas || 0}</b><span>requisições que passaram da data prometida</span></div>
      <div class="kpi"><b>${dias(t.ate_consultora)}</b><span>da abertura até a entrega à consultora (${t.entregues || 0} entregues)</span></div>
      <div class="kpi"><b style="color:${t.a_entregar ? 'var(--warn)' : 'inherit'}">${t.a_entregar || 0}</b><span>voltaram da fábrica e aguardam entrega à consultora</span></div>
    </div>
    <div class="card s">Em andamento agora: <b>${t.abertas || 0}</b> requisição(ões), abertas há <b>${dias(t.idade_aberta)}</b> em média · na fábrica há <b>${dias(t.idade_fabrica)}</b> em média.</div>

    <h2>Consumo de ouro</h2><p class="sub">Peças que voltaram com banho ou flash no período, pela tabela de consumo.</p>
    <div class="kpis">
      <div class="kpi"><b>${ml(c.banho_ml)}</b><span>no banho · ${c.pecas_banho || 0} peça(s)</span></div>
      <div class="kpi"><b>${ml(c.flash_ml)}</b><span>no flash · ${c.pecas_flash || 0} peça(s)</span></div>
    </div>
    ${(d.consumo_grupos || []).length ? `<div class="card stack">${d.consumo_grupos.map(x => `<div class="top2"><span>${esc(GNOME[x.grupo] || x.grupo)}</span><span class="s">banho <b>${ml(x.banho_ml)}</b> (${x.pecas_banho} pç) · flash <b>${ml(x.flash_ml)}</b> (${x.pecas_flash} pç)</span></div>`).join('')}</div>` : ''}

    ${g ? `
    <h2>Valores dos consertos</h2><p class="sub">Peças que voltaram no período e tiveram custo informado.</p>
    <div class="kpis">
      <div class="kpi"><b>${brl(vv.total)}</b><span>total em consertos</span></div>
      <div class="kpi"><b>${brl(vv.media)}</b><span>média por peça · ${vv.pecas_com_custo || 0} peça(s) com custo</span></div>
    </div>
    <div class="card stack"><b>Por consultora</b>${barras(d.valores_consultoras || [], x => x.consultora, x => Number(x.valor), '', brl)}</div>
    <div class="card stack"><b>Por grupo de peça</b>${barras(d.valores_grupos || [], x => GNOME[x.grupo] || x.grupo, x => Number(x.valor), '', brl)}</div>
    <h2>Top consultoras em consertos</h2><p class="sub">Requisições abertas no período.</p>
    <div class="card stack">${barras(d.consultoras, x => x.consultora, x => x.requisicoes, 'req.')}</div>
    <h2>Grupos de peças com mais consertos</h2>
    <div class="card stack">${barras(d.grupos, x => GNOME[x.grupo] || x.grupo, x => x.pecas, 'pç')}</div>
    <h2>Serviços realizados</h2><p class="sub">Peças que voltaram da manutenção no período.</p>
    <div class="card stack">${barras(d.servicos, x => SNOME[x.servico] || x.servico, x => x.pecas, 'pç')}</div>` : ''}`;
  ACT.atalho = b => {
    const h = new Date(), v = b.dataset.v;
    if (v === 'mes') Object.assign(PER, mesDe(h.getFullYear(), h.getMonth()));
    else if (v === 'anterior') Object.assign(PER, mesDe(h.getFullYear(), h.getMonth() - 1));
    else if (v === '7d') Object.assign(PER, {ini: ymd(Date.now() - 6 * 86400000), fim: ymd(Date.now())});
    else Object.assign(PER, {ini: null, fim: null});
    PER.atalho = v; ir('painel');
  };
  $('#pMes').onchange = e => { if (!e.target.value) return; const [a, m] = e.target.value.split('-').map(Number); Object.assign(PER, mesDe(a, m - 1), {atalho: ''}); ir('painel'); };
  ACT.aplicar = () => {
    const i = $('#pIni').value, f = $('#pFim').value;
    if (!i || !f) return toast('Escolha a data inicial e a final.', true);
    if (i > f) return toast('A data inicial precisa ser antes da final.', true);
    Object.assign(PER, {ini: i, fim: f, atalho: ''}); ir('painel');
  };
};

// ====== Cadastro de consumo de ouro (gestão) ======
R.consumo = async () => {
  const {data, error} = await sb.from('cons_consumo').select('*');
  if (error) throw error;
  const v = {}; data.forEach(x => v[x.grupo + '|' + x.servico] = x);
  const val = (g, s) => v[g + '|' + s] ? String(Number(v[g + '|' + s].ml)).replace('.', ',') : '0';
  $('#main').innerHTML = `
    <div><h1>Consumo de banho e flash</h1><p class="sub">Quantos ml de ouro cada tipo de peça gasta. Quando a Fran marca Banho ou Flash no retorno, o app grava o consumo da tabela daquele dia.</p></div>
    <div class="card stack">
      <div class="grid2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)"><b>Grupo</b><b>Banho (ml)</b><b>Flash (ml)</b></div>
      ${GRUPOS.map(([g, n]) => `<div class="grid2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);align-items:center">
        <span>${n}</span>
        <input id="cb_${g}" inputmode="decimal" value="${val(g, 'banho')}" aria-label="${n} banho ml">
        <input id="cf_${g}" inputmode="decimal" value="${val(g, 'flash')}" aria-label="${n} flash ml"></div>`).join('')}
      <button class="btn" data-act="salvarConsumo">Salvar tabela</button>
      <p class="s" style="margin:0">Mudanças valem para os próximos retornos. O que já foi registrado não muda.</p>
    </div>`;
  ACT.salvarConsumo = async b => {
    b.disabled = true;
    try {
      for (const [g] of GRUPOS) for (const [sv, pre] of [['banho', 'cb_'], ['flash', 'cf_']]) {
        const n = lerValor($('#' + pre + g).value) || 0;
        const {error: e} = await sb.from('cons_consumo').update({ml: n, atualizado_em: new Date().toISOString()}).eq('grupo', g).eq('servico', sv);
        if (e) throw e;
        S.consumo[g + '|' + sv] = n;
      }
      toast('Tabela de consumo salva.');
    } catch (e) { toast(erroMsg(e), true); }
    b.disabled = false;
  };
};

// ====== Usuários (gestão) ======
R.usuarios = async () => {
  const {data, error} = await sb.from('fab_perfis').select('*').order('nome');
  if (error) throw error;
  const ativos = data.filter(u => u.ativo), inativos = data.filter(u => !u.ativo);
  const opts = sel => Object.entries(PERFIL_NOME).map(([v, n]) => `<option value="${v}" ${sel === v ? 'selected' : ''}>${n}</option>`).join('');
  const cartao = u => {
    const eu = u.id === S.user.id;
    return `<div class="card stack" style="gap:10px${u.ativo ? '' : ';opacity:.75'}">
      <div class="top2"><div style="min-width:0"><b>${esc(u.nome || '—')}</b><div class="s" style="word-break:break-all">${esc(u.email)}</div></div>
        <span class="pill ${!u.ativo ? 'bad' : !u.perfil ? 'warn' : 'ok'}">${!u.ativo ? 'Desativado' : u.perfil ? PERFIL_NOME[u.perfil] : 'Sem perfil'}</span></div>
      ${u.troca_senha && u.ativo ? '<span class="s">Ainda não trocou a senha provisória.</span>' : ''}
      ${u.ativo ? `<div class="grid2">
          <div class="field"><label for="un${u.id}">Nome</label><input id="un${u.id}" value="${esc(u.nome)}"></div>
          <div class="field"><label for="up${u.id}">Perfil</label><select id="up${u.id}" ${eu ? 'disabled' : ''}><option value="">Escolha</option>${opts(u.perfil)}</select></div>
        </div>
        <div class="field"><label for="ue${u.id}">E-mail (login)</label><input id="ue${u.id}" type="email" value="${esc(u.email)}" autocomplete="off"></div>
        <button class="btn outline small" data-act="uSalvar" data-id="${u.id}">Salvar cadastro</button>
        <div class="grid2" style="align-items:end">
          <div class="field"><label for="us${u.id}">Nova senha provisória</label><input id="us${u.id}" type="text" autocomplete="off" placeholder="mín. 6 caracteres"></div>
          <button class="btn outline small" data-act="uSenha" data-id="${u.id}">Redefinir senha</button>
        </div>
        ${eu ? '<p class="s" style="margin:0">Este é o seu usuário.</p>' : `<div class="grid2">
          <button class="btn outline small" data-act="uDesativar" data-id="${u.id}">Desativar</button>
          <button class="btn outline small" data-act="uExcluir" data-id="${u.id}" style="border-color:var(--bad);color:var(--bad)">Excluir</button></div>`}`
      : `<p class="s" style="margin:0">Desativado${u.desativado_em ? ' em ' + fmtA(u.desativado_em.slice(0, 10)) : ''}. O histórico continua guardado.</p>
        <div class="grid2"><button class="btn outline small" data-act="uReativar" data-id="${u.id}">Reativar</button>
          <button class="btn outline small" data-act="uExcluir" data-id="${u.id}" style="border-color:var(--bad);color:var(--bad)">Excluir</button></div>`}
    </div>`;
  };
  $('#main').innerHTML = `
    <div><h1>Usuários</h1><p class="sub">Crie e gerencie os acessos da loja, da fábrica e da gestão.</p></div>
    <div class="dica stack" style="gap:6px">
      <b>Desativar ou excluir?</b>
      <span><b>Desativar:</b> para quem saiu da empresa ou não deve mais acessar. O acesso é bloqueado na hora e todo o histórico fica guardado. Pode ser reativado.</span>
      <span><b>Excluir:</b> somente para quem <b>nunca trabalhou na Fressen</b>, como um cadastro feito por engano. Quem já trabalhou não deve ser excluído, para manter os registros. O app bloqueia a exclusão de quem já tem registros.</span>
    </div>
    <form id="fNovo" class="card stack">
      <h2 style="margin:0">Novo usuário</h2>
      <div class="field"><label for="nNome">Nome</label><input id="nNome" required autocomplete="off"></div>
      <div class="field"><label for="nEmail">E-mail</label><input id="nEmail" type="email" required autocomplete="off" placeholder="a pessoa recebe aqui o link se esquecer a senha"></div>
      <div class="grid2">
        <div class="field"><label for="nSenha">Senha provisória</label><input id="nSenha" type="text" required autocomplete="off" placeholder="mín. 6 caracteres"></div>
        <div class="field"><label for="nPerfil">Perfil</label><select id="nPerfil" required><option value="">Escolha</option>${opts('')}</select></div>
      </div>
      <p class="s" style="margin:0">No primeiro acesso, a pessoa entra com a senha provisória e o app pede para ela criar a própria senha.</p>
      <button class="btn" type="submit" id="nCriar">Criar usuário</button>
    </form>
    <h2>Ativos (${ativos.length})</h2>${ativos.map(cartao).join('') || '<p class="vazio">Nenhum usuário ativo.</p>'}
    ${inativos.length ? `<h2>Desativados (${inativos.length})</h2>${inativos.map(cartao).join('')}` : ''}`;

  const acao = async (b, corpo, ok) => {
    b.disabled = true;
    try { await usr(corpo); toast(ok); ir('usuarios'); }
    catch (e) { b.disabled = false; toast(erroMsg(e), true); }
  };
  $('#fNovo').onsubmit = async e => {
    e.preventDefault();
    const nome = $('#nNome').value.trim(), email = $('#nEmail').value.trim(), senha = $('#nSenha').value, perfil = $('#nPerfil').value;
    if (senha.length < 6) return toast('A senha provisória precisa ter pelo menos 6 caracteres.', true);
    if (!perfil) return toast('Escolha o perfil.', true);
    await acao($('#nCriar'), {acao: 'criar', nome, email, senha, perfil}, `Usuário criado. Passe para ${primeiro(nome)} o e-mail e a senha provisória.`);
  };
  ACT.uSalvar = b => { const id = b.dataset.id, perfil = $('#up' + id).value;
    if (!perfil) return toast('Escolha o perfil.', true);
    const email = $('#ue' + id).value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('E-mail inválido.', true);
    acao(b, {acao: 'atualizar', id, nome: $('#un' + id).value.trim(), perfil, email}, 'Cadastro salvo. Se o e-mail mudou, a pessoa passa a entrar com o e-mail novo.'); };
  ACT.uSenha = b => { const id = b.dataset.id, senha = $('#us' + id).value;
    if (senha.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', true);
    if (!confirma(b)) return;
    acao(b, {acao: 'senha', id, senha}, 'Senha redefinida. No próximo acesso a pessoa cria a própria senha.'); };
  ACT.uDesativar = b => { if (!confirma(b)) return; acao(b, {acao: 'desativar', id: b.dataset.id}, 'Usuário desativado. O acesso foi bloqueado.'); };
  ACT.uReativar = b => acao(b, {acao: 'reativar', id: b.dataset.id}, 'Usuário reativado.');
  ACT.uExcluir = b => { if (!confirma(b)) return; acao(b, {acao: 'excluir', id: b.dataset.id}, 'Usuário excluído.'); };
};

iniciar();
</script>
